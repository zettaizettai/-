<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヘルパー週間スケジュール</title><link rel="stylesheet" href="style.css?v=20261019-day-mobile">
</head>
<body>
  <section style="padding:10px 16px;background:#edf5f1;border-bottom:1px solid #bfd7ce" aria-label="保存状態"><span id="storageStatus" role="status">データを読み込み中…</span><span id="storageRecovery" hidden> <button type="button" id="storageBackup">作業中の内容をバックアップ</button> <button type="button" id="storageReload">最新データを開く</button></span></section>
  <header class="app-header"><div><p class="eyebrow">介護事業所向け</p><h1>ヘルパー週間スケジュール</h1></div><div class="app-header-actions"><button class="button button-light" id="backupData">バックアップ保存</button><button class="button button-light" id="restoreData">バックアップ復元</button><button class="button button-light" id="openManagerManager">サ責管理</button><button class="button button-light" id="openHelperManager">ヘルパー管理</button><input class="hidden" id="restoreDataFile" type="file" accept="application/json,.json"></div></header>
  <main class="container">
    <nav class="tabs" aria-label="ページ切替">
      <button type="button" class="tab active" data-view="unassigned" aria-current="page"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h2m6 0h2m-10 3h2"/></svg><span>週間スケジュール</span></button>
      <button type="button" class="tab" data-view="helpers"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 4v2"/></svg><span>ヘルパー別</span></button>
      <button type="button" class="tab" data-view="list"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M11 8h5m-5 4h5m-5 4h5M8 8h.01M8 12h.01M8 16h.01"/></svg><span>未割当一覧</span></button>
      <button type="button" class="tab" data-view="clients"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17a4 4 0 0 1 8 0M2 7h3M2 12h3M2 17h3"/></svg><span>利用者一覧</span></button>
    </nav>
    <section class="summary" id="summary"></section><section id="view-unassigned" class="view active"></section><section id="view-helpers" class="view"></section><section id="view-list" class="view"></section><section id="view-clients" class="view"></section><section id="view-register" class="view"></section>
  </main>
  <div class="modal-backdrop hidden" id="serviceModalBackdrop"><div class="modal"><div class="modal-header"><h2 id="serviceModalTitle">サービス詳細</h2><button class="icon-button" data-close-modal="serviceModalBackdrop">×</button></div><div id="serviceModalBody"></div></div></div>
  <div class="modal-backdrop hidden" id="helperModalBackdrop"><div class="modal"><div class="modal-header"><h2>ヘルパー管理</h2><button class="icon-button" data-close-modal="helperModalBackdrop">×</button></div><form id="helperForm" class="inline-form"><input type="hidden" id="helperId"><label>ヘルパー名<input id="helperName" required placeholder="例：田中"></label><button class="button button-primary">追加・保存</button></form><div id="helperList" class="helper-list"></div></div></div>
  <div class="modal-backdrop hidden" id="managerModalBackdrop"><div class="modal"><div class="modal-header"><h2>サ責管理</h2><button class="icon-button" data-close-modal="managerModalBackdrop">×</button></div><form id="managerForm" class="inline-form"><input type="hidden" id="managerId"><label>サ責名<input id="managerName" required placeholder="例：大泉"></label><button class="button button-primary">追加・保存</button></form><div id="managerList" class="helper-list"></div></div></div>
  <script src="storage.js?v=1"></script><script src="persistence-ui.js?v=1"></script><script src="app.js?v=20261019-instant-update"></script>
</body></html>
